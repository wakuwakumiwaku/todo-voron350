#####################################################################
#   Macros
#####################################################################
[gcode_macro PARK]
gcode:
    {% set th = printer.toolhead %}
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y//2} Z30  

[gcode_macro G32]
gcode:
    SAVE_GCODE_STATE NAME=STATE_G32
    G90
    G28
    QUAD_GANTRY_LEVEL
    G28
    PARK
    RESTORE_GCODE_STATE NAME=STATE_G32
   
#[gcode_macro PRINT_START]
#   Use PRINT_START for the slicer starting script - please customise for your slicer of choice
#gcode:
#    G32                            ; home all axes
#    G90                            ; absolute positioning
#    G1 Z20 F3000                   ; move nozzle away from bed

#####################################################################
#   A better print_start macro for v2/trident
#####################################################################

## *** THINGS TO UNCOMMENT: ***
## Bed mesh (2 lines at 2 locations)
## Nevermore (if you have one)
## Z_TILT_ADJUST (For Trident only)
## QUAD_GANTRY_LEVEL (For V2.4 only)
## Beacon Contact logic (if you have one. 4 lines at 4 locations)

[gcode_macro PRINT_START]
gcode:
  # This part fetches data from your slicer.
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set target_chamber = params.CHAMBER|default("45")|int %}
  {% set target_chamber_minimal = params.CHAMBER_MINIMAL|default("0")|int %}
  {% set target_chamber_wait = [target_chamber, target_chamber_minimal]|select(">", 0)|min|default(0) %}
  
  # NEU: Option zum Überspringen des Heatsoaks (Standard: 0 / Nein)
  {% set skip_heatsoak = params.SKIP_HEATSOAK|default("0")|int %}

  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

  # Clear any lingering pause states
  CLEAR_PAUSE

  # Home the printer
  STATUS_HOMING
  G28
  G90

  ##  Uncomment for bed mesh (1 of 2 for bed mesh)
  BED_MESH_CLEAR

  # -----------------------------------------------------------------
  # HEATSOAK LOGIC (Modified)
  # -----------------------------------------------------------------
  # Check if bed is hot (>90c) AND skip_heatsoak is OFF
  {% if params.BED|int > 90 and skip_heatsoak == 0 %}
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"
    STATUS_HEATING
    M106 S255                                           # Turn on PT-fan
    # SET_PIN PIN=nevermore VALUE=1                     # Uncomment for Nevermore

    G1 X{x_wait} Y{y_wait} Z15 F9000                    # Go to center
    M190 S{target_bed}                                  # Set target temp
    SET_DISPLAY_TEXT MSG="Heatsoak: {target_chamber_wait}c"
    TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={target_chamber_wait}

  # If bed < 90 OR skip_heatsoak is ON
  {% else %}
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"
    STATUS_HEATING
    G1 X{x_wait} Y{y_wait} Z15 F9000                    # Go to center
    M190 S{target_bed}                                  # Set target temp
    
    # Only do the 5 min soak if we are NOT skipping heatsoak
    {% if skip_heatsoak == 0 %}
      SET_DISPLAY_TEXT MSG="Soak for 5 min"
      G4 P300000                                        # Wait 5 min
    {% else %}
      SET_DISPLAY_TEXT MSG="Skipping Soak"
    {% endif %}
    
  {% endif %}
  # -----------------------------------------------------------------

  # Heat hotend to 150c
  SET_DISPLAY_TEXT MSG="Hotend: 150c"
  M109 S150

  ##  Uncomment for V2.4 (Quad gantry level AKA QGL)
  SET_DISPLAY_TEXT MSG="Leveling"
  STATUS_LEVELING
  QUAD_GANTRY_LEVEL
  G28 Z

  ##  Uncomment for bed mesh (2 of 2 for bed mesh)
  SET_DISPLAY_TEXT MSG="Bed mesh"
  STATUS_MESHING
  BED_MESH_CALIBRATE ADAPTIVE=1                         # Added ADAPTIVE=1 (Recommended!)

  # Heat up the hotend to target
  SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"
  STATUS_HEATING
  G1 X{x_wait} Y{y_wait} Z15 F9000
  M107                                                  # Turn off partcooling fan
  M109 S{target_extruder}

  # Get ready to print
  SET_DISPLAY_TEXT MSG="Printer goes brr"
  STATUS_PRINTING
  G0 X{x_wait - 50} Y4 F10000
  G0 Z0.4
  G91
  G1 X100 E20 F1000
  G90



[gcode_macro EXERCISE_V2]
description: Moves X and Y back and forth 15 times to warm up or test.
gcode:
    # --- CONFIGURATION ---
    {% set loops = params.LOOPS|default(15)|int %}
    {% set speed = params.SPEED|default(300)|int * 60 %} # Default 300mm/s
    {% set margin = 30 %} # Safety margin from the edges in mm
    
    # --- GET PRINTER LIMITS ---
    {% set x_min = margin %}
    {% set y_min = margin %}
    {% set x_max = printer.toolhead.axis_maximum.x - margin %}
    {% set y_max = printer.toolhead.axis_maximum.y - margin %}

    # --- START ---
    {% if not 'xyz' in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    
    G90 # Absolute positioning
    
    # Move to start position
    G0 X{x_min} Y{y_min} F{speed}

    # --- MAIN LOOP ---
    {% for i in range(loops) %}
        G0 X{x_max} Y{y_max} F{speed} # Go to back-right
        G0 X{x_min} Y{y_min} F{speed} # Go to front-left
    {% endfor %}
    
    # --- FINISH ---
    G0 X{printer.toolhead.axis_maximum.x / 2} Y{printer.toolhead.axis_maximum.y / 2} F{speed} # Center head














   

[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
    
    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-5.0 F1800                 ; retract filament
    
    TURN_OFF_HEATERS

    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600  ; park nozzle at rear
    M107                                     ; turn off fan
    
    BED_MESH_CLEAR

    # The purpose of the SAVE_GCODE_STATE/RESTORE_GCODE_STATE
    # command pair is to restore the printer's coordinate system
    # and speed settings since the commands above change them.
    # However, to prevent any accidental, unintentional toolhead
    # moves when restoring the state, explicitly set MOVE=0.
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0

