# BIGTREETECH EBB SB2209 CAN (RP2040) Toolhead Configuration
# Configured for Voron 2.4 350mm (LDO Rev C) with Galileo 2 & Phaetus Rapido / Revo

[mcu EBBCan]
# Run `~/klippy-env/bin/python ~/klipper/scripts/canbus_query.py can0`
# to discover your toolhead board's UUID and paste it below:
canbus_uuid: YOUR_CANBUS_UUID_HERE

## Onboard temperature sensor on EBB SB2209
[temperature_sensor EBB_NTC]
sensor_type: Generic 3950
sensor_pin: EBBCan:gpio28

## ADXL345 Accelerometer (Onboard)
[adxl345]
cs_pin: EBBCan:gpio1
spi_software_sclk_pin: EBBCan:gpio2
spi_software_mosi_pin: EBBCan:gpio0
spi_software_miso_pin: EBBCan:gpio3
axes_map: z,-y,x

[resonance_tester]
probe_points: 175, 175, 20   # Center of 350mm bed
accel_chip: adxl345

#####################################################################
#   Extruder (Galileo 2 / LDO 36STH20)
#####################################################################

[extruder]
step_pin: EBBCan:gpio18
dir_pin: EBBCan:gpio19       # Note: If motor runs backward, change to !EBBCan:gpio19
enable_pin: !EBBCan:gpio17
rotation_distance: 47.088    # Galileo 2 calibrated value
gear_ratio: 9:1              # Galileo 2
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan:gpio7
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: EBBCan:gpio27
min_temp: 10
max_temp: 300
max_power: 0.95
min_extrude_temp: 170
pressure_advance: 0.03
pressure_advance_smooth_time: 0.030
control: pid
pid_kp: 25.470
pid_ki: 2.653
pid_kd: 61.129

[tmc2209 extruder]
uart_pin: EBBCan:gpio20
interpolate: false
run_current: 0.650
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
#   Fan Control
#####################################################################

## Part Cooling Fan (5015)
[fan]
pin: EBBCan:gpio13
kick_start_time: 0.5
off_below: 0.10

## Hotend Fan (3010 / 4010)
[heater_fan hotend_fan]
pin: EBBCan:gpio14
heater: extruder
heater_temp: 50.0
kick_start_time: 0.5
max_power: 1.0

#####################################################################
#   Probe / Voron Tap
#####################################################################

[probe]
## Probe Header: gpio6 (Ensure Probe voltage jumper is set to 5V!)
## (If connected to Endstop header instead, change pin to: ^EBBCan:gpio24)
pin: ^EBBCan:gpio6
x_offset: 0
y_offset: 0
z_offset: 0
speed: 4.5
samples: 3
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.025
samples_tolerance_retries: 3

activate_gcode:
    {% set PROBE_TEMP = 150 %}
    {% set MAX_TEMP = PROBE_TEMP + 5 %}
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% set TARGET_TEMP = printer.extruder.target %}

    {% if TARGET_TEMP > PROBE_TEMP %}
        { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (TARGET_TEMP, PROBE_TEMP)) }
        M109 S{ PROBE_TEMP }
    {% else %}
        {% if ACTUAL_TEMP > MAX_TEMP %}
            { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (ACTUAL_TEMP, MAX_TEMP)) }
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ MAX_TEMP }
        {% endif %}
    {% endif %}

#####################################################################
#   Stealthburner LEDs
#####################################################################

[neopixel sb_leds]
pin: EBBCan:gpio16
chain_count: 3
color_order: GRBW
initial_RED: 1.0
initial_GREEN: 0.0
initial_BLUE: 1.0
initial_WHITE: 0.0
